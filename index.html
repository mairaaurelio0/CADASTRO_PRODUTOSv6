
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque - Lojas Stavni</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="toast-container" aria-live="assertive"></div>

    <div class="container">

        <img src="logo.semfundo.png" alt="Logo Lojas Stavni" class="logo">

        <img src="fotobm.jpeg" alt="Bia e Maira">

        <h1>Cadastro de Produtos - Lojas Stavni</h1>

        <p>
            Seja bem-vindo colaborador, selecione o produto
            e realize o cadastro em nosso estoque!
        </p>

        <form id="produto-form">

            <div class="form-group">
                <label for="nome">Nome do produto:</label>
                <input
                    type="text"
                    id="nome"
                    list="sugestoes-produtos"
                    placeholder="Ex. Notebook"
                    autocomplete="off"
                    required
                >
                <datalist id="sugestoes-produtos"></datalist>
            </div>

            <div class="form-group">
                <label for="preco">Preço (R$):</label>
                <input
                    type="number"
                    id="preco"
                    step="0.01"
                    min="0.01"
                    placeholder="Ex. 3500.00"
                    required
                >
            </div>

            <div class="form-group">
                <label for="quantidade">Quantidade:</label>
                <input
                    type="number"
                    id="quantidade"
                    min="1"
                    step="1"
                    placeholder="Ex. 5"
                    required
                >
            </div>

            <button type="submit" class="btn-primary">
                Adicionar Produto
            </button>

        </form>

        <div class="resumo-container">

            <h3 id="total-estoque">
                Total em Estoque: R$ 0,00
            </h3>

            <button id="limpar-tabela" class="btn-danger" type="button">
                Limpar Tudo
            </button>

        </div>

        <!-- PESQUISA -->

        <div class="form-group busca-group">

            <label for="campo-busca">
                Pesquisar produto:
            </label>

            <input
                type="search"
                id="campo-busca"
                placeholder="Digite parte do nome..."
                autocomplete="off"
            >

        </div>


        <div class="form-group ordenacao-group">

            <label for="ordenar-produtos">
                Ordenar produtos por:
            </label>

            <select id="ordenar-produtos">

                <option value="padrao">
                    Padrão (Cadastro)
                </option>

                <option value="quantidade">
                    Menor Quantidade
                </option>

                <option value="maior-preco">
                    Maior Preço
                </option>

                <option value="menor-preco">
                    Menor Preço
                </option>

                <option value="alfabetica">
                    Ordem Alfabética (A–Z)
                </option>

            </select>

        </div>


        <div class="botoes-arquivo">

            <button
                type="button"
                id="exportar-csv"
                class="btn-primary"
            >
                Exportar CSV
            </button>

            <button
                type="button"
                id="exportar-json"
                class="btn-backup"
            >
                Baixar Backup JSON
            </button>

            <div class="form-group importar-group">

                <label for="importar-json">
                    Restaurar Backup JSON:
                </label>

                <input
                    type="file"
                    id="importar-json"
                    accept=".json,application/json"
                >

            </div>

        </div>

        <!-- TABELA -->

        <div class="tabela-container">

            <table id="tabela-produtos">

                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Preço</th>
                        <th>Qtd</th>
                        <th>Subtotal</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody>
                </tbody>

            </table>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
